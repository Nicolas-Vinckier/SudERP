services:
  mongodb:
    image: mongo:7.0
    container_name: sud-erp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: sud-erp-backend
    expose:
      - "8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017

  frontend:
    build: ./frontend
    container_name: sud-erp-frontend
    expose:
      - "80"
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    container_name: sud-erp-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
