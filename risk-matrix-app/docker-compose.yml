services:
  mongodb:
    image: mongo:7.0
    container_name: risk_matrix_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: risk_matrix_backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017

  frontend:
    build: ./frontend
    container_name: risk_matrix_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
